<!DOCTYPE html>
<html lang="ca">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Validació del formulari</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/colors.css">
    </head>
    <body>
        <h1>Formulari amb validació HTML5</h1>

        <form action="#" method="post">
            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" required>

            <br><br>

            <label for="email">Correu electrònic:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="contrasenya">Contrasenya (mínim 8 caràcters):</label>
            <input type="password" id="contrasenya" name="contrasenya" minlength="8" required>

            <br><br>

            <label for="telefon">Telèfon (9 dígits):</label>
            <input type="tel" id="telefon" name="telefon" pattern="[0-9]{9}" maxlength="9" required>

            <br><br>
            <button type="submit">Enviar</button>
        </form>
    </body>
</html>

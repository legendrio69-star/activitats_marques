<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">
        <img src="/img/karma-logo.svg" alt="Karma Logo">
      </a>
      
      <input type="checkbox" id="menu-toggle" class="menu-toggle">
      <label for="menu-toggle" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav class="nav-links">
        <a href="#">Meet Karma</a>
        <a href="#">How it Works</a>
        <a href="#" class="active">Store</a>
        <a href="#">Blog</a>
        <a href="#">Help</a>
        <a href="#">Login</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <img src="/img/first-background.jpg" alt="Karma Banner" class="hero-bg">
    
    <div class="hero-content">
      <h1>Introducing Karma</h1>
      <p>Bring WiFi with you, everywhere you go.</p>
      <a href="#" class="btn-primary">Learn More</a>
    </div>
  </section>

  <section class="features">
    <div class="container">
      <h2>Everyone needs a little Karma.</h2>
      
      <div class="features-grid">
        <div class="feature-item">
          <img src="/img/icon-devices.svg" alt="Devices" class="feature-icon">
          <h3>Internet for all devices</h3>
        </div>

        <div class="feature-item">
          <img src="/img/icon-coffee.svg" alt="Coffee" class="feature-icon">
          <h3>Boost your productivity</h3>
        </div>

        <div class="feature-item">
          <img src="/img/icon-refill.svg" alt="Refill" class="feature-icon">
          <h3>Pay as You Go</h3>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p class="join-title">Join us on</p>
      <div class="social-links">
        <a href="#" class="social-icon"><img src="/img/twitter-icon.svg" alt="Twitter"></a>
        <a href="#" class="social-icon"><img src="/img/facebook-icon.svg" alt="Facebook"></a>
        <a href="#" class="social-icon"><img src="/img/instagram-icon.svg" alt="Instagram"></a>
      </div>
      <p class="copyright">Karma Mobility, Inc.</p>
    </div>
  </footer>

</body>
</html>
